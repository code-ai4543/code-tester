name: Run NSE Scraper Loop

on:

    # Restarts the background loop runner every 3 hours automatically
  
  workflow_dispatch:

concurrency:
  group: nse-scraper-group
  cancel-in-progress: true

jobs:
  scrape_and_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # Restores the last known Discord message ID (if any) so this run edits
      # the same message instead of posting a new one. Since exact cache keys
      # can't be overwritten, we save under a unique key each run and restore
      # from the most recent one matching the prefix.
      - name: Restore Discord message ID cache
        uses: actions/cache@v4
        with:
          path: discord_message_id.txt
          key: discord-message-id-${{ github.run_id }}
          restore-keys: |
            discord-message-id-

      - name: Execute Scraper Engine
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python script.py
